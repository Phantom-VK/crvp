seed: 42

paths:
  data_dir: data
  artifacts_dir: artifacts

cv:
  n_splits: 5
  n_repeats: 5

dataset:
  url: https://archive.ics.uci.edu/static/public/411/extention+of+z+alizadeh+sani+dataset.zip
  filename: extention of Z-Alizadeh sani dataset.xlsx

decision_threshold: 0.5
selection_metric: roc_auc
selection_tolerance_se: 1.0

calibration:
  method: sigmoid
  cv: 5

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 300
    min_samples_leaf: 3
    n_jobs: -1
  hist_gradient_boosting:
    max_depth: 3
    learning_rate: 0.05
    max_iter: 150
    l2_regularization: 1.0
